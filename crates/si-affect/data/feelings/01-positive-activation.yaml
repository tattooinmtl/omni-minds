# Positive activation — high-arousal pleasant states.
# Schema: id, name, family, definition, valence, arousal, tension, bias, nearest.
# Axes: valence -1..1 (displeasure..pleasure), arousal -1..1 (calm..activated),
#        tension -1..1 (in control..threatened).
- id: delight
  name: Delight
  family: positive_activation
  definition: Intense, unanticipated pleasure that arrives before the reason for it can be named.
  valence: 0.85
  arousal: 0.70
  tension: -0.30
  bias: {explore: 0.25, express: 0.2}
  nearest: [elation, joy, glee]
- id: elation
  name: Elation
  family: positive_activation
  definition: Overwhelming uplift, usually following a release of tension that had been held.
  valence: 0.90
  arousal: 0.75
  tension: -0.25
  bias: {explore: 0.3, express: 0.25}
  nearest: [delight, triumph, jubilation]
- id: jubilation
