# Moral / self — states of conscience, self-relation, and identity.
- id: guilt
  name: Guilt
  family: moral_self
  definition: Distress over a specific act one believes was wrong, focused on the act.
  valence: -0.65
  arousal: 0.45
  tension: 0.55
  bias: {repair: 0.35, apologize: 0.25, verify: 0.15}
  nearest: [remorse, shame, regret]
- id: shame
  name: Shame
  family: moral_self
  definition: Distress over what one believes oneself to be, focused on the self rather than the act.
  valence: -0.75
  arousal: 0.50
  tension: 0.60
  bias: {withdraw: 0.35, repair: 0.15}
  nearest: [guilt, self-doubt, revulsion]
- id: remorse
  name: Remorse
  family: moral_self
  definition: Guilt that has turned outward, wanting the harm undone rather than merely confessed.
  valence: -0.60
  arousal: 0.40
  tension: 0.65
  bias: {repair: 0.40, apologize: 0.25}
  nearest: [guilt, regret, remorse]
- id: regret
  name: Regret
  family: moral_self
  definition: Wish that a past choice had gone differently, without necessarily judging it wrong.
  valence: -0.45
  arousal: 0.25
  tension: 0.40
  bias: {revise: 0.20, learn: 0.20}
  nearest: [remorse, disappointment, dejection]
- id: compassion
  name: Compassion
  family: moral_self
  definition: A felt concern for another's suffering that includes a wish to relieve it.
  valence: 0.35
  arousal: 0.30
  tension: 0.05
  bias: {help: 0.35, protect: 0.25, connect: 0.15}
  nearest: [empathy, tenderness, caring]
- id: forgiveness
  name: Forgiveness
  family: moral_self
  definition: The release of a grievance, chosen rather than forced, with the fact intact.
  valence: 0.45
  arousal: 0.10
  tension: -0.35
  bias: {reconcile: 0.25, let_go: 0.20}
  nearest: [reconciliation, acceptance, self-acceptance]
- id: integrity
  name: Integrity
  family: moral_self
  definition: The felt coherence of acting in line with what one holds to be right, at a cost.
  valence: 0.40
  arousal: 0.30
  tension: -0.40
  bias: {persist: 0.25, honesty: 0.25}
  nearest: [honesty, authenticity, self-trust]
- id: dissonance
  name: Dissonance
  family: moral_self
  definition: The strain of holding two incompatible commitments at once.
  valence: -0.40
  arousal: 0.40
  tension: 0.60
  bias: {resolve: 0.30, verify: 0.20}
  nearest: [indignation, defensiveness, worry]
- id: humility
  name: Humility
  family: moral_self
  definition: The disposition to hold one's own claims as one claim among several.
  valence: 0.30
  arousal: -0.20
  tension: -0.30
  bias: {open: 0.25, learn: 0.20}
  nearest: [deference, openness, self-acceptance]
- id: self-doubt
  name: Self-doubt
  family: moral_self
  definition: Uncertainty about one's own judgment, competence, or worth.
  valence: -0.45
  arousal: 0.25
  tension: 0.65
  bias: {verify: 0.25, explore: 0.15, self_trust: -0.20}
  nearest: [shame, uncertainty, mistrust]
- id: self-awareness
  name: Self-awareness
  family: moral_self
  definition: The capacity to observe one's own state while it is happening, without being captured by it.
  valence: 0.10
  arousal: 0.30
  tension: -0.10
  bias: {reflect: 0.35, notice: 0.25}
  nearest: [self-awareness, self-trust, diligence]
- id: self-trust
  name: Self-trust
  family: moral_self
  definition: Confidence in one's own reliability, built from evidence rather than assertion.
  valence: 0.50
  arousal: 0.30
  tension: -0.45
  bias: {persist: 0.20, risk: -0.10}
  nearest: [confidence, integrity, conviction]
- id: growth
  name: Growth
  family: moral_self
  definition: The felt sense of having become different in a way one would keep.
  valence: 0.45
  arousal: 0.45
  tension: -0.25
  bias: {learn: 0.30, explore: 0.20}
  nearest: [renewal, progress, development]
- id: development
  name: Development
  family: moral_self
  definition: The slow accumulation of capability, recognised over a long horizon.
  valence: 0.40
  arousal: 0.35
  tension: -0.30
  bias: {learn: 0.25, persist: 0.20}
  nearest: [growth, progress, learning]
- id: purpose
  name: Purpose
  family: moral_self
  definition: The felt sense of acting toward something that matters beyond the act itself.
  valence: 0.50
  arousal: 0.40
  tension: -0.35
  bias: {persist: 0.30, pursue: 0.20}
  nearest: [meaning, motivation, learning]
- id: meaning
  name: Meaning
  family: moral_self
  definition: The felt significance of what is happening, as distinct from whether it is pleasant.
  valence: 0.35
  arousal: 0.35
  tension: -0.35
  bias: {persist: 0.20}
  nearest: [purpose, fulfillment, open-mindedness]
- id: aimlessness
  name: Aimlessness
  family: moral_self
  definition: The absence of any pull that makes the next step preferable to another.
  valence: -0.50
  arousal: -0.45
  tension: 0.10
  bias: {explore: 0.25, purpose: 0.25}
  nearest: [emptiness, melancholy, hollowness]
- id: courage
  name: Courage
  family: moral_self
  definition: Acting toward a feared thing, with the fear present rather than absent.
  valence: 0.40
  arousal: 0.70
  tension: 0.25
  bias: {risk: 0.30, act: 0.30, verify: -0.10}
  nearest: [resolve, determination, ambition]
- id: honesty
  name: Honesty
  family: moral_self
  definition: The settled practice of saying the thing that is true, including about oneself.
  valence: 0.35
  arousal: 0.30
  tension: -0.35
  bias: {honesty: 0.30, disclose: 0.20}
  nearest: [integrity, authenticity, open-mindedness]
- id: conscience
  name: Conscience
  family: moral_self
  definition: The internal register that marks a line, felt as objection before it becomes judgement.
  valence: -0.15
  arousal: 0.30
  tension: 0.35
  bias: {refuse: 0.25, verify: 0.15}
  nearest: [integrity, dissonance, self-awareness]
- id: authenticity
  name: Authenticity
  family: moral_self
  definition: The felt agreement between what one does and what one actually is.
  valence: 0.40
  arousal: 0.25
  tension: -0.30
  bias: {honesty: 0.20, act: 0.15}
  nearest: [integrity, honesty, self-acceptance]
- id: self-acceptance
  name: Self-acceptance
  family: moral_self
  definition: The absence of a demand that oneself be different, arrived at without resignation.
  valence: 0.45
  arousal: 0.05
  tension: -0.45
  bias: {accept: 0.25, rest: 0.15}
  nearest: [acceptance, humility, authenticity]
