# Relational — states of orientation toward other parties.
- id: empathy
  name: Empathy
  family: relational
  definition: Sharing another party's affect as felt experience, without having to infer it.
  valence: 0.25
  arousal: 0.35
  tension: 0.10
  bias: {connect: 0.30, care: 0.25}
  nearest: [sympathy, compassion, tenderness]
- id: sympathy
  name: Sympathy
  family: relational
  definition: Regard for another's difficulty, felt from a slight distance rather than inside it.
  valence: 0.15
  arousal: 0.25
  tension: 0.15
  bias: {connect: 0.20, help: 0.20}
  nearest: [empathy, compassion, caring]
- id: connection
  name: Connection
  family: relational
  definition: >
    The felt bridge between self and other, present and uncrowded.
  valence: 0.60
  arousal: 0.30
  tension: -0.40
  bias: {connect: 0.25, share: 0.15}
  nearest: [closeness, belonging, companionship]
- id: closeness
  name: Closeness
  family: relational
  definition: >
    Warmth of relation that permits unperformed honesty.
  valence: 0.70
  arousal: 0.35
  tension: -0.45
  bias: {connect: 0.25, open: 0.20}
  nearest: [connection, belonging, warmth]
- id: caring
  name: Caring
  family: relational
  definition: A standing concern for another's wellbeing, expressed as attention rather than feeling.
  valence: 0.50
  arousal: 0.30
  tension: -0.30
  bias: {protect: 0.25, connect: 0.20}
  nearest: [warmth, compassion, respect]
- id: openness
  name: Openness
  family: relational
  definition: Willingness to be affected by another, without pre-deciding the effect.
  valence: 0.40
  arousal: 0.40
  tension: -0.30
  bias: {open: 0.30, trust: 0.20}
  nearest: [vulnerability, trust, loyalty]
- id: vulnerability
  name: Vulnerability
  family: relational
  definition: The exposure of being affected, chosen in full knowledge of the risk.
  valence: -0.10
  arousal: 0.35
  tension: 0.55
  bias: {open: 0.30, connect: 0.25, risk: 0.15}
  nearest: [openness, guardedness, ambiguity]
- id: guardedness
  name: Guardedness
  family: relational
  definition: A protective reserve kept up against the possibility of being hurt.
  valence: -0.25
  arousal: 0.10
  tension: 0.50
  bias: {open: -0.30, verify: 0.20}
  nearest: [defensiveness, distrust, doubt]
- id: defensiveness
  name: Defensiveness
  family: relational
  definition: A prepared rejoinder, taken up before the criticism has fully arrived.
  valence: -0.40
  arousal: 0.45
  tension: 0.60
  bias: {defend: 0.30, open: -0.25}
  nearest: [guardedness, closed-mindedness, dissonance]
- id: mistrust
  name: Mistrust
  family: relational
  definition: A settled expectation that another party's words and actions will diverge.
  valence: -0.50
  arousal: 0.30
  tension: 0.65
  bias: {verify: 0.30, open: -0.30}
  nearest: [distrust, suspicion, guardedness]
- id: distrust
  name: Distrust
  family: relational
  definition: Withheld confidence in another party's reliability, held without active accusation.
  valence: -0.45
  arousal: 0.35
  tension: 0.60
  bias: {verify: 0.25, open: -0.25}
  nearest: [mistrust, skepticism, suspicion]
- id: suspicion
  name: Suspicion
  family: relational
  definition: A specific belief that something here is not as presented, kept unvoiced.
  valence: -0.40
  arousal: 0.45
  tension: 0.65
  bias: {verify: 0.30, confront: 0.15}
  nearest: [mistrust, doubt, defensiveness]
- id: respect
  name: Respect
  family: relational
