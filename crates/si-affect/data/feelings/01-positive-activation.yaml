# Positive activation — high-arousal pleasant states.
# Schema: id, name, family, definition, valence, arousal, tension, bias, nearest.
# Axes: valence -1..1 (displeasure..pleasure), arousal -1..1 (calm..activated),
#        tension -1..1 (in control..threatened).
- id: delight
  name: Delight
  family: positive_activation
  definition: Intense, unanticipated pleasure that arrives before the reason for it can be named.
  valence: 0.85
  arousal: 0.70
  tension: -0.30
  bias: {explore: 0.25, share: 0.20}
  nearest: [joy, elation, glee]
- id: elation
