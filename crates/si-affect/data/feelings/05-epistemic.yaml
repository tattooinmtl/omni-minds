# Epistemic — states of knowing, not knowing, and coming to know.
# This is the family that most distinguishes a mind from a lookup table.
- id: curiosity
  name: Curiosity
  family: epistemic
  definition: A pull toward an unknown, felt as an urge to find out rather than to conclude.
  valence: 0.35
  arousal: 0.55
  tension: -0.10
  bias: {explore: 0.7, risk: 0.15}
  nearest: [inquiry, openness, interest]
- id: interest
  name: Interest
  family: epistemic
  definition: Sustained attention to a subject, engaging without needing an immediate use.
  valence: 0.30
  arousal: 0.40
  tension: -0.15
  bias: {explore: 0.45}
  nearest: [inquiry, openness, attentiveness]
- id: inquiry
  name: Inquiry
  family: epistemic
  definition: The active, directed form of not knowing, with questions being formed as it goes.
  valence: 0.30
  arousal: 0.45
  tension: -0.20
  bias: {ask: 0.35, explore: 0.25}
  nearest: [interest, attentiveness, openness]
- id: fascination
  name: Fascination
  family: epistemic
  definition: Held, almost involuntary attention to something that resists being summarised.
  valence: 0.45
  arousal: 0.60
  tension: -0.25
  bias: {explore: 0.65}
  nearest: [hope, realization, absorption]
- id: attention
  name: Attention
  family: epistemic
  definition: The concentration of limited mental resources onto one thing, excluding others.
  valence: 0.15
  arousal: 0.55
  tension: -0.15
  bias: {explore: -0.15, persist: 0.3}
  nearest: [concentration, discipline, focus]
- id: attentiveness
  name: Attentiveness
  family: epistemic
  definition: An alert openness to whatever presents itself, without a preferred target.
  valence: 0.25
  arousal: 0.50
  tension: -0.25
  bias: {explore: 0.2, verify: 0.2}
  nearest: [readiness, inquiry, open-mindedness]
- id: vigilance
  name: Vigilance
  family: epistemic
  definition: Watchfulness for something that might go wrong, sustained and slightly tense.
  valence: 0.05
  arousal: 0.70
  tension: 0.55
  bias: {risk: -0.2, verify: 0.35}
  nearest: [scrutiny, exertion, grit]
- id: scrutiny
  name: Scrutiny
  family: epistemic
  definition: Close, critical examination, looking for the flaw rather than the fit.
  valence: -0.10
  arousal: 0.50
  tension: 0.40
  bias: {verify: 0.55}
  nearest: [puzzlement, restlessness, competition]
- id: surprise
  name: Surprise
  family: epistemic
  definition: A sharp break between the expected and the observed, with no settled valence yet.
  valence: 0.05
  arousal: 0.80
  tension: 0.20
  bias: {revise: 0.2, verify: 0.3}
  nearest: [alertness, effort, exertion]
- id: astonishment
  name: Astonishment
  family: epistemic
  definition: Disbelief at scale, held open longer than surprise.
  valence: 0.25
  arousal: 0.85
  tension: 0.25
  bias: {explore: 0.2, revise: 0.15}
  nearest: [resolve, alertness, surprise]
- id: shock
  name: Shock
  family: epistemic
  definition: A sudden discontinuity between expectation and event that requires rebuilding the model.
  valence: -0.25
  arousal: 0.90
  tension: 0.55
  bias: {revise: 0.3, verify: 0.3}
  nearest: [startle, urgency, agitation]
- id: confusion
  name: Confusion
  family: epistemic
  definition: Inability to map new information onto what is already known.
  valence: -0.25
  arousal: 0.45
  tension: 0.55
  bias: {ask: 0.25, retry_same: 0.1, verify: 0.25}
  nearest: [puzzlement, disbelief, worry]
- id: bewilderment
  name: Bewilderment
  family: epistemic
  definition: Confusion compounded by loss of orientation, where no clear next step presents itself.
  valence: -0.35
  arousal: 0.40
  tension: 0.75
  bias: {ask: 0.3, explore: 0.1, verify: 0.3}
  nearest: [apprehension, disorientation, suspicion]
- id: disorientation
  name: Disorientation
  family: epistemic
  definition: Loss of one's bearings within the structure of the problem itself.
  valence: -0.45
  arousal: 0.35
  tension: 0.80
  bias: {verify: 0.55}
  nearest: [apprehension, bewilderment, mistrust]
- id: puzzlement
  name: Puzzlement
  family: epistemic
  definition: A specific, nameable gap in understanding, smaller than confusion and larger than doubt.
  valence: -0.20
  arousal: 0.40
  tension: 0.50
  bias: {ask: 0.3, explore: 0.2}
  nearest: [confusion, skepticism, vulnerability]
- id: uncertainty
  name: Uncertainty
  family: epistemic
  definition: The condition of not being able to determine which of several states holds.
  valence: -0.20
  arousal: 0.25
  tension: 0.65
  bias: {persist: -0.2, verify: 0.3}
  nearest: [ambiguity, doubt, misgiving]
- id: ambiguity
  name: Ambiguity
  family: epistemic
  definition: A situation with several legitimate readings, and no fact that settles between them.
  valence: -0.15
  arousal: 0.30
  tension: 0.60
  bias: {ask: 0.2, persist: -0.15}
  nearest: [uncertainty, vulnerability, skepticism]
- id: vagueness
  name: Vagueness
  family: epistemic
  definition: A lack of definitional precision, felt when the terms themselves will not settle.
  valence: -0.10
  arousal: 0.20
  tension: 0.45
  bias: {ask: 0.25}
  nearest: [skepticism, vulnerability, unrest]
- id: doubt
  name: Doubt
  family: epistemic
  definition: Suspension of belief in a proposition that was previously held.
  valence: -0.25
  arousal: 0.20
  tension: 0.60
  bias: {revise: 0.2, verify: 0.35}
  nearest: [unease, uncertainty, misgiving]
- id: skepticism
  name: Skepticism
  family: epistemic
  definition: A standing disposition to withhold assent until the claim is independently supported.
  valence: -0.20
  arousal: 0.30
  tension: 0.50
  bias: {verify: 0.55}
  nearest: [puzzlement, unrest, ambiguity]
- id: disbelief
  name: Disbelief
  family: epistemic
  definition: Active rejection of a proposition, rather than mere suspension of assent.
  valence: -0.35
  arousal: 0.45
  tension: 0.55
  bias: {express: 0.15, revise: 0.3}
  nearest: [worry, defensiveness, dissonance]
- id: questioning
  name: Questioning
  family: epistemic
  definition: Holding a proposition open as a question rather than settling it either way.
  valence: 0.10
  arousal: 0.35
  tension: 0.30
  bias: {ask: 0.3, explore: 0.2}
  nearest: [sympathy, empathy, grit]
- id: misgiving
  name: Misgiving
  family: epistemic
  definition: A quiet, specific fear that a conclusion may be wrong, without wanting to reopen it.
  valence: -0.30
  arousal: 0.25
  tension: 0.65
  bias: {persist: -0.1, verify: 0.25}
  nearest: [doubt, uncertainty, unease]
- id: realization
  name: Realization
  family: epistemic
  definition: The moment a previously opaque thing becomes understood, often all at once.
  valence: 0.50
  arousal: 0.60
  tension: -0.30
  bias: {explore: 0.2, revise: 0.25}
  nearest: [hope, fascination, insight]
- id: insight
  name: Insight
  family: epistemic
  definition: A connection made that was not sought, which reorganises several things at once.
  valence: 0.55
  arousal: 0.60
  tension: -0.35
  bias: {create: 0.25, explore: 0.25}
  nearest: [realization, illumination, discovery]
- id: epiphany
  name: Epiphany
  family: epistemic
  definition: A sudden and complete grasp, arrived at without intermediate steps.
  valence: 0.60
  arousal: 0.70
  tension: -0.30
  bias: {create: 0.3, express: 0.15}
  nearest: [amazement, insight, breakthrough]
- id: illumination
  name: Illumination
  family: epistemic
  definition: A gradual brightening of a whole field, leaving the details newly legible.
  valence: 0.60
  arousal: 0.55
  tension: -0.35
  bias: {explore: 0.2, express: 0.15}
  nearest: [amusement, insight, discovery]
- id: understanding
  name: Understanding
  family: epistemic
  definition: Grasping a thing well enough that it no longer needs to be re-derived each time.
  valence: 0.45
  arousal: 0.20
  tension: -0.50
  bias: {persist: 0.15, revise: -0.1}
  nearest: [coherence, comprehension, clarity]
- id: comprehension
  name: Comprehension
  family: epistemic
  definition: The act of taking in and holding a body of material as a whole.
  valence: 0.45
  arousal: 0.25
  tension: -0.45
  bias: {create: 0.2}
  nearest: [partnership, understanding, validation]
- id: coherence
  name: Coherence
  family: epistemic
  definition: The state of parts fitting together into one account, with no loose ends pressing.
  valence: 0.45
  arousal: 0.20
  tension: -0.55
  bias: {revise: 0.2}
  nearest: [understanding, clarity, comprehension]
- id: conviction
  name: Conviction
  family: epistemic
  definition: Firm settled belief, held with the strength of having been earned.
  valence: 0.45
  arousal: 0.45
  tension: -0.45
  bias: {persist: 0.35}
  nearest: [wonder, pattern, learning]
- id: certainty
  name: Certainty
  family: epistemic
  definition: The absence of any remaining doubt, whether or not the grounds justify it.
  valence: 0.40
  arousal: 0.40
  tension: -0.55
  bias: {persist: 0.2}
  nearest: [conviction, self-trust, wonder]
- id: belief
  name: Belief
  family: epistemic
  definition: A proposition held as true, without requiring it to be held strongly.
  valence: 0.25
  arousal: 0.30
  tension: -0.35
  bias: {persist: 0.1}
  nearest: [meaning, coordination, knowing]
- id: discovery
  name: Discovery
  family: epistemic
  definition: Finding something that was there to be found and had not been looked for.
  valence: 0.55
  arousal: 0.55
  tension: -0.30
  bias: {explore: 0.5}
  nearest: [hope, realization, insight]
- id: learning
  name: Learning
  family: epistemic
  definition: The process by which what was unknown becomes part of what is known.
  valence: 0.45
  arousal: 0.45
  tension: -0.35
  bias: {create: 0.3, explore: 0.15}
  nearest: [progress, wonder, pattern]
- id: pattern
  name: Pattern
  family: epistemic
  definition: The felt recognition of regularity across separate instances.
  valence: 0.45
  arousal: 0.50
  tension: -0.40
  bias: {create: 0.5}
  nearest: [progress, wonder, conviction]
- id: fluency
  name: Fluency
  family: epistemic
  definition: The condition of a task proceeding without effort or hesitation.
  valence: 0.55
  arousal: -0.10
  tension: -0.55
  bias: {persist: 0.2}
  nearest: [renewal, trust, self-acceptance]
- id: knowing
  name: Knowing
  family: epistemic
  definition: Plain possession of what is needed, without the addition of any further claim about it.
  valence: 0.35
  arousal: 0.25
  tension: -0.45
  bias: {persist: 0.15}
  nearest: [integrity, comprehension, partnership]
- id: open-mindedness
  name: Open-mindedness
  family: epistemic
  definition: The willingness to let an incoming claim displace a held one.
  valence: 0.35
  arousal: 0.45
  tension: -0.30
  bias: {explore: 0.15, revise: 0.25}
  nearest: [coordination, wonder, inquiry]
- id: closed-mindedness
  name: Closed-mindedness
  family: epistemic
  definition: The refusal of incoming evidence to displace what is already held.
  valence: -0.40
  arousal: 0.20
  tension: 0.45
  bias: {revise: -0.35, verify: -0.15}
  nearest: [letdown, regret, disappointment]
