  arousal: 0.60
  tension: 0.25
  bias: {abandon: -0.25, persist: 0.4}
  nearest: [perseverance, persistence, resolve]
- id: patience
  name: Patience
  family: effort
  definition: >
    The capacity to let a slow thing finish, without the wait becoming costly.
