[package]
name = "si-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Exposes the raw connection so an integration test can assert that the
# append-only triggers really do deny UPDATE and DELETE. Gated behind a
# feature so a production build cannot reach the connection at all.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
uuid.workspace = true
tracing.workspace = true

[dev-dependencies]
# The hot-path benchmark: the per-event cost of an append (M-HOTPATH).
criterion.workspace = true
tempfile = "3"
# A package may dev-depend on itself. This is what lets an integration test in
# `tests/` see a `#[cfg(feature = "test-support")]` accessor, which a plain
# `#[cfg(test)]` gate cannot provide.
si-log = { path = ".", features = ["test-support"] }
# The store tests read the `payload` column and the table's columns straight
# out of SQLite, so they need the driver itself, not just the store's API.
rusqlite.workspace = true

[[bench]]
name = "append"
harness = false
