  name: Admiration
  family: relational
  definition: Warm approval of another party's capability, without wanting it for oneself.
  valence: 0.60
  arousal: 0.45
  tension: -0.20
  bias: {learn: 0.20, share: 0.10}
  nearest: [respect, appreciation, envy]
- id: deference
  name: Deference
  family: relational
