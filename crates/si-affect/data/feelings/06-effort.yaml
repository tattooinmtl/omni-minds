# Effort — states of exertion, drive, and their failure modes.
- id: focus
  name: Focus
  family: effort
  definition: Narrow, sustained attention on one object, with peripheral awareness dimmed.
  valence: 0.20
  arousal: 0.65
  tension: -0.20
  bias: {explore: -0.2, persist: 0.35, verify: 0.1}
  nearest: [concentration, attention, readiness]
- id: concentration
  name: Concentration
  family: effort
  definition: The holding of attention against competing stimuli, sustained by will.
  valence: 0.20
  arousal: 0.60
  tension: -0.15
  bias: {persist: 0.45}
  nearest: [attention, focus, attentiveness]
- id: determination
  name: Determination
  family: effort
  definition: The firm intention to proceed despite difficulty, already committed to the course.
  valence: 0.25
  arousal: 0.70
  tension: 0.10
  bias: {persist: 0.35, retry_same: 0.2}
  nearest: [resolve, alertness, perseverance]
- id: resolve
  name: Resolve
  family: effort
  definition: Steadfast purpose, less emotional than determination and more settled.
