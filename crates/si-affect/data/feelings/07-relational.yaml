# Relational — states of orientation toward other parties.
- id: empathy
  name: Empathy
  family: relational
  definition: Sharing another party's affect as felt experience, without having to infer it.
  valence: 0.25
  arousal: 0.35
  tension: 0.10
  bias: {connect: 0.55}
  nearest: [compassion, sympathy, diligence]
- id: sympathy
  name: Sympathy
  family: relational
  definition: Regard for another's difficulty, felt from a slight distance rather than inside it.
  valence: 0.15
  arousal: 0.25
  tension: 0.15
  bias: {connect: 0.4}
  nearest: [empathy, questioning, conscience]
- id: connection
  name: Connection
  family: relational
  definition: >
    The felt bridge between self and other, present and uncrowded.
  valence: 0.60
  arousal: 0.30
  tension: -0.40
  bias: {connect: 0.25, express: 0.15}
  nearest: [warmth, closeness, companionship]
- id: closeness
  name: Closeness
  family: relational
  definition: >
    Warmth of relation that permits unperformed honesty.
  valence: 0.60
  arousal: 0.25
  tension: -0.45
  bias: {connect: 0.45}
  nearest: [tenderness, connection, belonging]
- id: caring
  name: Caring
  family: relational
