# Moral / self — states of conscience, self-relation, and identity.
- id: guilt
  name: Guilt
  family: moral_self
  definition: Distress over a specific act one believes was wrong, focused on the act.
  valence: -0.65
  arousal: 0.45
  tension: 0.55
  bias: {express: 0.25, revise: 0.35, verify: 0.15}
  nearest: [rejection, exclusion, breach]
- id: shame
  name: Shame
  family: moral_self
  definition: Distress over what one believes oneself to be, focused on the self rather than the act.
  valence: -0.75
  arousal: 0.50
  tension: 0.60
  bias: {connect: 0.35, revise: 0.15}
  nearest: [revulsion, rejection, disgust]
- id: remorse
  name: Remorse
  family: moral_self
  definition: Guilt that has turned outward, wanting the harm undone rather than merely confessed.
  valence: -0.60
  arousal: 0.40
  tension: 0.65
  bias: {express: 0.25, revise: 0.4}
  nearest: [breach, exclusion, envy]
- id: regret
  name: Regret
  family: moral_self
