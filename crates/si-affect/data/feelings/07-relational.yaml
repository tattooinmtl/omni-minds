  valence: -0.60
  arousal: 0.15
  tension: 0.55
  bias: {connect: 0.25, withdraw: 0.10}
  nearest: [loneliness, exclusion, alienation]
- id: alienation
  name: Alienation
  family: relational
  definition: Separation from a group one is notionally part of, with the separation internalised.
  valence: -0.60
  arousal: 0.25
  tension: 0.55
  bias: {connect: 0.20, withdraw: 0.15}
  nearest: [isolation, exclusion, loneliness]
- id: belonging
